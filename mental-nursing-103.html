<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15253d"><title>精神看護学 暗記カード｜103問</title><style>
:root{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color-scheme:light;background:#edf2f9;color:#182b45}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button{cursor:pointer}header{background:#15253d;color:white;padding:18px max(16px,calc((100vw - 820px)/2));}h1{font-size:1.2rem;margin:0 0 5px}header p{font-size:.82rem;margin:0;color:#c7d8ec}.wrap{max-width:820px;margin:auto;padding:15px 14px 28px}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:6px 0 12px}select,.small{border:1px solid #b7c7da;background:white;color:#233b58;border-radius:11px;padding:10px 12px}.small{font-weight:650}.stats{display:flex;justify-content:space-between;gap:8px;font-size:.86rem;color:#435b76;margin:8px 0}.progress{background:#d6e0ef;height:8px;border-radius:8px;overflow:hidden}.progress>div{height:100%;background:#397fb7;transition:width .2s}.card{margin-top:14px;background:#fff;border:2px solid #d1ddeb;border-radius:20px;min-height:300px;box-shadow:0 8px 24px #142e4b18;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:28px 21px;touch-action:pan-y;user-select:none;text-align:center;position:relative;outline-offset:4px}.card:focus-visible{outline:3px solid #397fb7}.eyebrow{color:#56738f;font-size:.86rem;font-weight:700;margin-bottom:18px}.q{font-size:clamp(1.25rem,4.7vw,1.8rem);font-weight:750;line-height:1.65}.answer{font-size:clamp(1.18rem,4.4vw,1.65rem);font-weight:800;color:#136c6a;line-height:1.6}.explanation{font-size:clamp(.97rem,3.8vw,1.15rem);line-height:1.85;margin-top:20px;border-top:1px solid #e2ebf4;padding-top:17px;color:#334a61}.tap{font-size:.82rem;color:#71849a;margin-top:23px}.actions{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:9px;margin-top:12px}.actions button{min-height:50px;border-radius:12px;font-weight:750;border:1px solid #b7c7da;background:#fff;color:#173c5e}.actions button.primary{background:#196caa;color:white;border-color:#196caa}.ratings{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.ratings button{border:0;border-radius:12px;min-height:48px;font-weight:750}.miss{background:#fae4e2;color:#8b302b}.known{background:#daf2e7;color:#1b6951}.help{margin-top:18px;background:white;border:1px solid #d1ddeb;border-radius:14px;padding:14px;font-size:.86rem;line-height:1.9}.help h2{font-size:1rem;margin:0 0 5px}.help kbd{background:#eef2f8;border:1px solid #c6d2e3;border-bottom-width:2px;border-radius:5px;padding:2px 6px;font-family:inherit}.note{color:#5f6f81;font-size:.77rem;margin:14px 2px;line-height:1.6}.sr{position:absolute;left:-9999px}@media(min-width:650px){.card{min-height:360px;padding:35px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header><h1>精神看護学｜暗記カード</h1><p>全103問・問題をタップして解答と解説を表示</p></header><main class="wrap"><nav style="margin:5px 0 13px"><a href="./index.html" class="small" style="display:inline-block;text-decoration:none">← 一問一答問題集の一覧に戻る</a></nav><div class="controls"><label>問題集 <select id="deck"><option value="a">① 精神科病棟・危機と防衛機制（33問）</option><option value="b">② デイケア・検査・入院形態（70問）</option><option value="all">③ 両方まとめて（103問）</option></select></label><button id="shuffle" class="small">シャッフル</button><button id="missed" class="small">苦手だけ</button><button id="reset" class="small">履歴をリセット</button></div><div class="stats"><span id="num"></span><span id="counts"></span></div><div class="progress"><div id="bar"></div></div><section id="card" class="card" tabindex="0" role="button" aria-label="カードを裏返す"><div id="cardcontent"></div><div class="tap" id="hint">タップまたは Space で答えを見る</div></section><div class="actions"><button id="prev">← 前へ</button><button id="flip" class="primary">答えを見る（Space）</button><button id="next">次へ →</button></div><div class="ratings"><button class="miss" id="wrong">× まだ覚えていない［2］</button><button class="known" id="right">✓ 覚えた［1］</button></div><div class="help"><h2>キーボード操作</h2><div><kbd>Space</kbd> / <kbd>Enter</kbd>：表・裏を切替　 <kbd>←</kbd> <kbd>→</kbd>：前・次のカード</div><div><kbd>1</kbd>：覚えた　 <kbd>2</kbd>：まだ覚えていない　 <kbd>S</kbd>：シャッフル</div><div>スマホ：カードをタップして裏返す／左右にスワイプして移動。回答結果はこのブラウザ内に保存されます。</div></div><p class="note">※2011年刊行の教材に由来する統計・分類や旧制度の説明を含みます。特に入院形態は現行法と照合して学習してください。元のChatGPT暗記カードの学習記録とは同期しません。</p></main><script>const cards=[{"id": "a-1", "deck": "a", "n": 1, "q": "WHOの「精神の健康」に含まれるストレスへの対処とは？", "a": "日常の通常のストレスに対処できること。", "e": "能力の発揮、生産的な活動、地域社会への貢献も含む。"}, {"id": "a-2", "deck": "a", "n": 2, "q": "平成20年調査で精神科入院患者の最多の疾患群は？", "a": "統合失調症など（約6割）。", "e": "当時の入院患者の構成比。現在の割合とは区別する。"}, {"id": "a-3", "deck": "a", "n": 3, "q": "平成20年調査で精神科外来患者の最多の疾患群は？", "a": "気分障害（約3割）。", "e": "うつ病や双極性障害などを含む。当時の統計値。"}, {"id": "a-4", "deck": "a", "n": 4, "q": "教材で紹介されるWHOの国際疾病分類は？", "a": "ICD-10。", "e": "国際疾病分類の第10版。現在はICD-11も公表されている。"}, {"id": "a-5", "deck": "a", "n": 5, "q": "教材で紹介される米国精神医学会の診断分類は？", "a": "DSM-IV-TR。", "e": "当時の改訂第4版。現在はDSM-5-TRが刊行されている。"}, {"id": "a-6", "deck": "a", "n": 6, "q": "平成20年当時の日本の精神科病床の平均在院日数は？", "a": "312.9日。", "e": "教材記載の当時の値。長期入院が日本の精神科医療の課題だった。"}, {"id": "a-7", "deck": "a", "n": 7, "q": "医療上の入院の必要性が低くても退院先がなく入院が続く状態は？", "a": "社会的入院。", "e": "住居や地域生活支援の不足などで退院が難しくなる。"}, {"id": "a-8", "deck": "a", "n": 8, "q": "2004年の精神保健医療福祉改革の基本方針は？", "a": "入院医療中心から地域生活中心へ。", "e": "地域移行と生活支援を進め、社会的入院の解消を目指した。"}, {"id": "a-9", "deck": "a", "n": 9, "q": "長期入院で意欲や生活能力が低下する状態は？", "a": "施設症（ホスピタリズム）。", "e": "施設環境への過度な適応や依存、退行などが生じる。"}, {"id": "a-10", "deck": "a", "n": 10, "q": "困難を従来の対処法で解決できず混乱する状態は？", "a": "危機。", "e": "対処能力を超える出来事で心理的均衡が崩れた状態。"}, {"id": "a-11", "deck": "a", "n": 11, "q": "入学・就職・結婚・定年などに伴う危機は？", "a": "発達的危機。", "e": "人生の発達段階や役割の変化に伴う、ある程度予測できる危機。"}, {"id": "a-12", "deck": "a", "n": 12, "q": "事故・災害・失業・病気などによって生じる危機は？", "a": "状況的危機。", "e": "予期しない出来事によって、従来の対処能力が揺らぐ。"}, {"id": "a-13", "deck": "a", "n": 13, "q": "危機に直面すると必ず精神疾患を発症する？", "a": "いいえ。", "e": "適切な対処や支援によって回復し、成長につながることもある。"}, {"id": "a-14", "deck": "a", "n": 14, "q": "危機介入はどのようなタイミングと期間で行う？", "a": "速やかに、短期集中的に。", "e": "早期に安全を確保し、問題整理と支援につなげる。"}, {"id": "a-15", "deck": "a", "n": 15, "q": "精神障害者の医療・保護・社会復帰等を定める法律は？", "a": "精神保健福祉法。", "e": "入院制度や人権擁護、社会復帰支援などを定める。"}, {"id": "a-16", "deck": "a", "n": 16, "q": "心神喪失等の状態で重大な他害行為をした人の医療を定める法律は？", "a": "医療観察法。", "e": "裁判所の手続きを経て適切な医療と社会復帰支援を行う。"}, {"id": "a-17", "deck": "a", "n": 17, "q": "自殺対策の総合的な推進を定める法律は？", "a": "自殺対策基本法。", "e": "自殺予防だけでなく、未遂者や遺族への支援なども重視する。"}, {"id": "a-18", "deck": "a", "n": 18, "q": "自閉スペクトラム症やADHD等への支援を定める法律は？", "a": "発達障害者支援法。", "e": "早期発見と、ライフステージに応じた切れ目ない支援を目指す。"}, {"id": "a-19", "deck": "a", "n": 19, "q": "児童虐待を発見した際の通告義務を定める法律は？", "a": "児童虐待防止法。", "e": "虐待が疑われる児童の発見時は速やかに児童相談所等へ通告する。"}, {"id": "a-20", "deck": "a", "n": 20, "q": "高齢者虐待の防止と養護者支援を定める法律は？", "a": "高齢者虐待防止法。", "e": "早期発見や通報、被虐待者の保護、養護者への支援を定める。"}, {"id": "a-21", "deck": "a", "n": 21, "q": "フロイトのいう防衛機制とは？", "a": "自我による無意識的な心の働き。", "e": "不安や葛藤から心を守る。健康な人にも生じる。"}, {"id": "a-22", "deck": "a", "n": 22, "q": "耐え難い考えや記憶を無意識に押し込む防衛機制は？", "a": "抑圧。", "e": "つらい感情や記憶を意識から遠ざける。意識的な我慢とは異なる。"}, {"id": "a-23", "deck": "a", "n": 23, "q": "受け入れ難い現実を認めようとしない防衛機制は？", "a": "否認。", "e": "病気の告知など、強い衝撃を受けた現実を認められない反応。"}, {"id": "a-24", "deck": "a", "n": 24, "q": "他者の特徴や価値観を取り入れる防衛機制は？", "a": "同一化（取り入れ）。", "e": "尊敬する人などを模倣し、自分の安心感や自尊心を保つ。"}, {"id": "a-25", "deck": "a", "n": 25, "q": "感情を本来の相手ではない別の対象に向ける防衛機制は？", "a": "置き換え。", "e": "上司への怒りを直接出せず、家族など別の相手に向ける例。"}, {"id": "a-26", "deck": "a", "n": 26, "q": "自分の受け入れ難い感情を他者のものと思う防衛機制は？", "a": "投影。", "e": "自分の敵意を認めず、相手が自分を嫌っていると感じる例。"}, {"id": "a-27", "deck": "a", "n": 27, "q": "本来の感情とは正反対の態度を取る防衛機制は？", "a": "反動形成。", "e": "嫌悪感を抱く相手に、逆に過剰な親切さを示す例。"}, {"id": "a-28", "deck": "a", "n": 28, "q": "もっともらしい理由で自分の失敗などを正当化する防衛機制は？", "a": "合理化。", "e": "不合格を『試験に価値がないから』と説明するなど、自尊心を守る。"}, {"id": "a-29", "deck": "a", "n": 29, "q": "ストレスで以前の発達段階のような行動に戻る防衛機制は？", "a": "退行。", "e": "強い不安の下で、幼児のように甘えたり泣いたりする例。"}, {"id": "a-30", "deck": "a", "n": 30, "q": "衝動を社会的に認められる活動へ転換する防衛機制は？", "a": "昇華。", "e": "攻撃的な衝動をスポーツや芸術活動などに向ける。"}, {"id": "a-31", "deck": "a", "n": 31, "q": "精神疾患へのなりやすさに関わる2種類の要因は？", "a": "先天的要因と後天的要因。", "e": "遺伝的素因や生育環境、生活上の経験などが相互に作用する。"}, {"id": "a-32", "deck": "a", "n": 32, "q": "脆弱性とストレスの相互作用で発症を説明するモデルは？", "a": "ストレス脆弱性モデル。", "e": "個人の脆弱性とストレス負荷、保護要因などの関係で理解する。"}, {"id": "a-33", "deck": "a", "n": 33, "q": "ストレス脆弱性モデルに基づく発症・再発予防で重要なのは？", "a": "早期発見・適切な治療支援・ストレスの軽減。", "e": "環境調整や対処能力、支援体制の強化が再発予防に役立つ。"}, {"id": "b-1", "deck": "b", "n": 1, "q": "日中に通って精神科のリハビリを行うサービスは？", "a": "精神科デイケア。", "e": "社会生活に必要な能力の回復を目指す。"}, {"id": "b-2", "deck": "b", "n": 2, "q": "精神科デイケアの主な目的は？", "a": "社会生活機能の回復。", "e": "交流や生活能力を改善し、地域生活につなげる。"}, {"id": "b-3", "deck": "b", "n": 3, "q": "精神科デイケアではどのような活動を行う？", "a": "スポーツやレクリエーションなど。", "e": "状態に応じた活動を通して回復を支援する。"}, {"id": "b-4", "deck": "b", "n": 4, "q": "デイケアのプログラムは何に合わせて決める？", "a": "患者の状態や必要性。", "e": "能力や回復段階に合わせて活動を選ぶ。"}, {"id": "b-5", "deck": "b", "n": 5, "q": "精神科デイケアは1日何時間が標準？", "a": "6時間。", "e": "教材に記載された標準実施時間。"}, {"id": "b-6", "deck": "b", "n": 6, "q": "精神科デイケアを実施できる医療機関は？", "a": "病院と診療所。", "e": "入院設備のない診療所でも実施できる。"}, {"id": "b-7", "deck": "b", "n": 7, "q": "精神科デイケアは退院後の患者にも利用される？", "a": "はい。", "e": "退院後の生活リズムや社会復帰を支援する。"}, {"id": "b-8", "deck": "b", "n": 8, "q": "午後4時以降に開始する精神科のケアは？", "a": "精神科ナイトケア。", "e": "夕方以降に行うリハビリテーション。"}, {"id": "b-9", "deck": "b", "n": 9, "q": "精神科ナイトケアは何時間が標準？", "a": "4時間。", "e": "デイケアは6時間、ナイトケアは4時間。"}, {"id": "b-10", "deck": "b", "n": 10, "q": "精神科デイ・ナイトケアは何時間が標準？", "a": "10時間。", "e": "昼から夜まで継続して活動する。"}, {"id": "b-11", "deck": "b", "n": 11, "q": "精神科ショート・ケアは何時間が標準？", "a": "3時間。", "e": "短時間で参加できる精神科のケア。"}, {"id": "b-12", "deck": "b", "n": 12, "q": "精神科デイケアは治療の一環である。○か×か？", "a": "○。", "e": "単なる娯楽ではなく、社会生活機能の改善を目指す。"}, {"id": "b-13", "deck": "b", "n": 13, "q": "脳の電気活動を調べる検査は？", "a": "脳波検査。", "e": "脳の機能的な異常を調べる。"}, {"id": "b-14", "deck": "b", "n": 14, "q": "脳波検査が特に重要な疾患の一つは？", "a": "てんかん。", "e": "特徴的な異常脳波がみられることがある。"}, {"id": "b-15", "deck": "b", "n": 15, "q": "脳の構造を画像で調べる代表的な検査は？", "a": "CT・MRI。", "e": "脳の器質的な病変などを調べる。"}, {"id": "b-16", "deck": "b", "n": 16, "q": "頭部外傷が疑われる患者に用いる画像検査は？", "a": "CT・MRI。", "e": "脳出血や損傷などを確認する。"}, {"id": "b-17", "deck": "b", "n": 17, "q": "認知症などで脳の器質的病変を調べる検査は？", "a": "CT・MRI。", "e": "脳萎縮や器質的な異常などを調べる。"}, {"id": "b-18", "deck": "b", "n": 18, "q": "統合失調症は画像検査だけで診断できる？", "a": "いいえ。", "e": "症状や経過などを総合的に評価する。"}, {"id": "b-19", "deck": "b", "n": 19, "q": "精神科の診断で特に重要な情報収集方法は？", "a": "問診。", "e": "症状や生活歴、病気の経過などを確認する。"}, {"id": "b-20", "deck": "b", "n": 20, "q": "知的能力を調べる検査は？", "a": "知能検査。", "e": "理解力などの知的機能を評価する。"}, {"id": "b-21", "deck": "b", "n": 21, "q": "知的発達の遅れが疑われるときに行う検査は？", "a": "知能検査。", "e": "知的能力を客観的に評価する。"}, {"id": "b-22", "deck": "b", "n": 22, "q": "成人の知能を調べる代表的な検査は？", "a": "WAIS。", "e": "ウェクスラー成人知能検査。"}, {"id": "b-23", "deck": "b", "n": 23, "q": "教材で示されるWAISの対象年齢は？", "a": "16歳以上。", "e": "教材に記載された対象年齢。"}, {"id": "b-24", "deck": "b", "n": 24, "q": "子どもの知能を調べるウェクスラー式検査は？", "a": "WISC。", "e": "児童の知的能力を評価する。"}, {"id": "b-25", "deck": "b", "n": 25, "q": "WAISの知能指数（IQ）の平均値は？", "a": "100。", "e": "平均が100になるように標準化されている。"}, {"id": "b-26", "deck": "b", "n": 26, "q": "感情や性格の特徴を調べる検査は？", "a": "性格検査（人格検査）。", "e": "心理的な特徴や感情の傾向を評価する。"}, {"id": "b-27", "deck": "b", "n": 27, "q": "多数の質問から人格特性を調べる検査は？", "a": "MMPI。", "e": "ミネソタ多面的人格検査。"}, {"id": "b-28", "deck": "b", "n": 28, "q": "インクのしみを見せる心理検査は？", "a": "ロールシャッハテスト。", "e": "模様に対する反応から心理的特徴を探る。"}, {"id": "b-29", "deck": "b", "n": 29, "q": "認知機能の評価に使う長谷川式の検査は？", "a": "HDS-R。", "e": "改訂長谷川式簡易知能評価スケール。"}, {"id": "b-30", "deck": "b", "n": 30, "q": "患者が自由に出入りできない病棟は？", "a": "閉鎖病棟。", "e": "病棟への出入りが管理されている。"}, {"id": "b-31", "deck": "b", "n": 31, "q": "閉鎖病棟の出入り口にある設備は？", "a": "鍵のかかる扉。", "e": "自由な出入りを制限するために設ける。"}, {"id": "b-32", "deck": "b", "n": 32, "q": "教材で閉鎖病棟に多いとされる入院形態は？", "a": "医療保護入院・措置入院。", "e": "本人の同意によらない入院の例。"}, {"id": "b-33", "deck": "b", "n": 33, "q": "閉鎖病棟の設備で特に重視されることは？", "a": "患者の安全確保。", "e": "自傷や自殺などの事故を防止する。"}, {"id": "b-34", "deck": "b", "n": 34, "q": "閉鎖病棟でドアノブを工夫する理由は？", "a": "自殺・自傷事故の予防。", "e": "ひもなどを引っ掛けにくくする。"}, {"id": "b-35", "deck": "b", "n": 35, "q": "病棟で物を掛ける場所を少なくする理由は？", "a": "自殺事故の予防。", "e": "首つりなどに利用される危険を減らす。"}, {"id": "b-36", "deck": "b", "n": 36, "q": "患者を隔離するための部屋は？", "a": "保護室。", "e": "安全確保のため、必要な場合に隔離を行う。"}, {"id": "b-37", "deck": "b", "n": 37, "q": "閉鎖病棟では病室ごとに鍵を設けることもある？", "a": "はい。", "e": "安全管理上の必要性に応じて設置する。"}, {"id": "b-38", "deck": "b", "n": 38, "q": "本人の同意で入院する形態は？", "a": "任意入院。", "e": "患者本人の意思による入院。"}, {"id": "b-39", "deck": "b", "n": 39, "q": "任意入院の患者に原則行う処遇は？", "a": "開放的処遇。", "e": "本人の自由を尊重し、不必要な制限を避ける。"}, {"id": "b-40", "deck": "b", "n": 40, "q": "精神科の入院形態を定める主な法律は？", "a": "精神保健福祉法。", "e": "精神障害者の医療や保護などを定める。"}, {"id": "b-41", "deck": "b", "n": 41, "q": "教材で紹介される主な精神科入院形態は何種類？", "a": "5種類。", "e": "任意・医療保護・応急・措置・緊急措置入院。"}, {"id": "b-42", "deck": "b", "n": 42, "q": "本人の同意で行う入院は？", "a": "任意入院。", "e": "患者自身が入院に同意する。"}, {"id": "b-43", "deck": "b", "n": 43, "q": "任意入院では本人以外の同意が必須？", "a": "いいえ。", "e": "本人の同意に基づいて入院する。"}, {"id": "b-44", "deck": "b", "n": 44, "q": "本人の同意なしに行われる入院形態の一つは？", "a": "医療保護入院。", "e": "法定の要件を満たせば本人の同意なしに入院できる。"}, {"id": "b-45", "deck": "b", "n": 45, "q": "強制的な入院制度の基本的な目的は？", "a": "医療と保護。", "e": "必要な治療と患者の安全を確保する。"}, {"id": "b-46", "deck": "b", "n": 46, "q": "本人の同意なしに一定の要件で行う入院は？", "a": "医療保護入院。", "e": "本人の同意による入院が難しい場合の制度。"}, {"id": "b-47", "deck": "b", "n": 47, "q": "医療保護入院の必要性を判断する指定医は？", "a": "精神保健指定医。", "e": "入院の医学的必要性を判断する。"}, {"id": "b-48", "deck": "b", "n": 48, "q": "教材当時、医療保護入院で同意する人は？", "a": "保護者（旧制度）。", "e": "現在は保護者制度が廃止され、家族等の同意などに変更。"}, {"id": "b-49", "deck": "b", "n": 49, "q": "教材当時、保護者がいない場合の役割を担うのは？", "a": "市区町村長（旧制度）。", "e": "現在の市町村長同意制度とは要件が異なる。"}, {"id": "b-50", "deck": "b", "n": 50, "q": "教材で示される精神保健指定医の臨床経験は？", "a": "5年以上。", "e": "指定医には一定の臨床経験などの要件がある。"}, {"id": "b-51", "deck": "b", "n": 51, "q": "教材で示される指定医の精神科臨床経験は？", "a": "3年以上。", "e": "一般の臨床経験とは別に精神科での経験が必要。"}, {"id": "b-52", "deck": "b", "n": 52, "q": "精神保健指定医を指定するのは誰？", "a": "厚生労働大臣。", "e": "必要な要件や研修を満たした医師を指定する。"}, {"id": "b-53", "deck": "b", "n": 53, "q": "同意が得られず急いで入院が必要なときの制度は？", "a": "応急入院。", "e": "本人や家族等の同意を得られない緊急時に用いる。"}, {"id": "b-54", "deck": "b", "n": 54, "q": "応急入院の期間は原則何時間以内？", "a": "72時間以内。", "e": "緊急時に限って認められる短期の入院。"}, {"id": "b-55", "deck": "b", "n": 55, "q": "応急入院はどの病院でも行える？", "a": "いいえ。", "e": "法令上の指定を受けた病院で行う。"}, {"id": "b-56", "deck": "b", "n": 56, "q": "自傷・他害のおそれがある場合の行政による入院は？", "a": "措置入院。", "e": "精神障害による自傷・他害のおそれなどが要件。"}, {"id": "b-57", "deck": "b", "n": 57, "q": "措置入院では原則何名の指定医の診察が必要？", "a": "2名以上。", "e": "指定医の診察結果が一致する必要がある。"}, {"id": "b-58", "deck": "b", "n": 58, "q": "措置入院を行う権限を持つのは？", "a": "都道府県知事。", "e": "法律に基づいて行政が入院措置を行う。"}, {"id": "b-59", "deck": "b", "n": 59, "q": "措置入院には本人の同意が必要？", "a": "いいえ。", "e": "法定要件を満たせば本人の同意なしで行う。"}, {"id": "b-60", "deck": "b", "n": 60, "q": "特に緊急を要する措置入院の形態は？", "a": "緊急措置入院。", "e": "通常の措置入院の手続きを待てない場合に用いる。"}, {"id": "b-61", "deck": "b", "n": 61, "q": "緊急措置入院では指定医は何名必要？", "a": "1名。", "e": "緊急性が高いため1名の診察で行える。"}, {"id": "b-62", "deck": "b", "n": 62, "q": "緊急措置入院は何時間以内？", "a": "72時間以内。", "e": "緊急措置入院には時間制限がある。"}, {"id": "b-63", "deck": "b", "n": 63, "q": "入院時に患者へ知らせる必要がある入院情報は？", "a": "入院形態。", "e": "自分がどの制度で入院するのかを知るため。"}, {"id": "b-64", "deck": "b", "n": 64, "q": "患者が退院を求める権利は？", "a": "退院請求権。", "e": "入院継続の必要性について審査を求められる。"}, {"id": "b-65", "deck": "b", "n": 65, "q": "病院での待遇の改善を求める請求は？", "a": "処遇改善請求。", "e": "入院中の不適切な処遇の改善を求める。"}, {"id": "b-66", "deck": "b", "n": 66, "q": "退院請求や処遇改善請求を審査する機関は？", "a": "精神医療審査会。", "e": "入院の必要性や処遇などを審査する。"}, {"id": "b-67", "deck": "b", "n": 67, "q": "退院請求をすれば必ず退院できる？", "a": "いいえ。", "e": "審査を経て入院の必要性などが判断される。"}, {"id": "b-68", "deck": "b", "n": 68, "q": "教材で示される入院形態・権利の告知方法は？", "a": "書面および口頭。", "e": "患者が入院制度と権利を理解できるよう知らせる。"}, {"id": "b-69", "deck": "b", "n": 69, "q": "患者が医師の提案に同意して入院した。入院形態は？", "a": "任意入院。", "e": "病棟の開放・閉鎖ではなく、本人の同意が判断の基本。"}, {"id": "b-70", "deck": "b", "n": 70, "q": "精神科入院患者の権利を定める主な法律は？", "a": "精神保健福祉法。", "e": "入院制度と患者の権利擁護を定める。"}];const $=id=>document.getElementById(id);const key='mental-nursing-flashcards-v1';let history={};try{history=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){};let deck='a',order=[],index=0,shown=false,missedOnly=false;const save=()=>{try{localStorage.setItem(key,JSON.stringify(history))}catch(e){}};function makeOrder(){order=cards.filter(c=>(deck==='all'||c.deck===deck)&&(!missedOnly||history[c.id]==='miss')).map(c=>c.id);index=0;shown=false;render()}function current(){return cards.find(c=>c.id===order[index])}function render(){const c=current();$('num').textContent=c?`${index+1} / ${order.length} 問`:'0 / 0 問';const subset=cards.filter(c=>deck==='all'||c.deck===deck);let good=subset.filter(c=>history[c.id]==='known').length,bad=subset.filter(c=>history[c.id]==='miss').length;$('counts').textContent=`覚えた ${good} ・ 苦手 ${bad} ・ 未判定 ${subset.length-good-bad}`;$('bar').style.width=`${subset.length?good/subset.length*100:0}%`;if(!c){$('cardcontent').replaceChildren(document.createTextNode('該当する問題はありません。'));$('hint').textContent='「苦手だけ」を解除してください';return}const box=$('cardcontent');box.replaceChildren();const top=document.createElement('div');top.className='eyebrow';top.textContent=`${c.deck==='a'?'問題集①':'問題集②'}・Q${c.n} ／ ${shown?'裏面':'表面'}`;box.append(top);let line=document.createElement('div');line.className=shown?'answer':'q';line.textContent=shown?c.a:c.q;box.append(line);if(shown){let explain=document.createElement('div');explain.className='explanation';explain.textContent='解説：'+c.e;box.append(explain)}$('flip').textContent=shown?'問題に戻す（Space）':'答えを見る（Space）';$('hint').textContent=shown?'「1」覚えた / 「2」まだ覚えていない':'タップまたは Space で答えを見る'}function flip(){if(!current())return;shown=!shown;render()}function step(d){if(!order.length)return;index=(index+d+order.length)%order.length;shown=false;render()}function rate(val){const c=current();if(!c)return;history[c.id]=val;save();if(missedOnly&&val==='known'){order.splice(index,1);if(index>=order.length)index=0;shown=false;render()}else step(1)}function shuffle(){for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}index=0;shown=false;render()}$('deck').addEventListener('change',e=>{deck=e.target.value;makeOrder()});$('flip').onclick=flip;$('card').onclick=flip;$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('right').onclick=()=>rate('known');$('wrong').onclick=()=>rate('miss');$('shuffle').onclick=shuffle;$('missed').onclick=()=>{missedOnly=!missedOnly;$('missed').textContent=missedOnly?'全問題に戻す':'苦手だけ';makeOrder()};$('reset').onclick=()=>{if(confirm('このHTML内の学習記録をすべてリセットしますか？')){history={};save();makeOrder()}};document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||['SELECT','INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;const k=e.key;if([' ','ArrowLeft','ArrowRight','Enter','1','2','s','S'].includes(k))e.preventDefault();if(k===' '||k==='Enter')flip();else if(k==='ArrowLeft')step(-1);else if(k==='ArrowRight')step(1);else if(k==='1')rate('known');else if(k==='2')rate('miss');else if(k.toLowerCase()==='s')shuffle()});let startX=0,startY=0;$('card').addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX;startY=e.changedTouches[0].clientY},{passive:true});$('card').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.4){e.preventDefault();step(dx<0?1:-1)}},{passive:false});const requestedDeck=new URLSearchParams(location.search).get('deck');if(['a','b','all'].includes(requestedDeck)){deck=requestedDeck;$('deck').value=deck;}makeOrder();</script></body></html>
