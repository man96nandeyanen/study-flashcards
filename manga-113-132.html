<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>漫画制作実践カード 45問</title><style>
:root{color-scheme:light dark;--bg:#f5f6f9;--paper:#fff;--ink:#202936;--muted:#64748b;--line:#d6dce5;--accent:#165c96;--soft:#edf4fa} @media(prefers-color-scheme:dark){:root{--bg:#15191f;--paper:#222832;--ink:#eff3fa;--muted:#aab6c6;--line:#48515f;--accent:#92c9ff;--soft:#27384a}} *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,sans-serif}main{max-width:820px;margin:auto;padding:20px}h1{font-size:clamp(21px,4vw,29px);margin:0}p{margin:6px 0 14px}.small{font-size:13px;color:var(--muted)}button,select{font:inherit;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 15px;cursor:pointer;min-height:44px}button:disabled{opacity:.4;cursor:default}button:focus-visible,article:focus-visible{outline:3px solid var(--accent)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin:12px 0}article{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:24px;min-height:300px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;overflow-wrap:anywhere}article h2{font-size:clamp(20px,4vw,28px);margin:8px 0}article h3{font-size:14px;color:var(--muted);margin:12px 0 3px}.check{padding:12px;border-radius:10px;background:var(--soft)}.nav button{flex:1}.nav{display:flex;gap:8px;margin:12px 0}progress{width:100%;height:9px;accent-color:var(--accent)}.rating{display:flex;gap:8px;margin:12px 0}.rating button{flex:1}.hint{text-align:center;margin-top:18px}.answer{color:var(--accent);font-weight:bold;font-size:21px}kbd{border:1px solid var(--line);border-radius:4px;padding:1px 5px} @media(max-width:500px){main{padding:12px}article{padding:18px;min-height:300px}button{padding:9px 10px}.small{font-size:12px}}
</style><main><h1>漫画制作実践カード</h1><p class="small">『マンガの作り方』書籍 p.113–132 ／ 全45問</p><div class="row"><span id="stats" class="small"></span><select id="mode" aria-label="出題範囲"><option value="all">全問題</option><option value="star">重要問題</option><option value="miss">要復習</option></select></div><progress id="progress" max="45" value="0"></progress><div class="row small"><span id="position"></span><span id="page"></span></div><article id="card" tabindex="0" role="button" aria-label="カードをめくる" aria-live="polite"></article><div class="rating"><button id="ok">✓ 理解した [1]</button><button id="miss">× 要復習 [2]</button></div><div class="nav"><button id="prev">← 前へ</button><button id="flip">めくる [Space]</button><button id="next">次へ →</button></div><div class="row"><button id="shuffle">シャッフル [S]</button><button id="ordered">出題順に戻す</button><button id="reset">記録リセット</button></div><p class="small">PC：Space＝めくる、←／→＝移動、1＝理解した、2＝要復習、S＝シャッフル。スマホ：カードやボタンをタップ。学習結果は利用中のブラウザに保存（端末間同期なし）。</p></main><script>
const qs=[["113", "構成とは何か？", "物語の各部分を組み立てること。", "起承転結などの形式を用いて、物語全体の流れを組み立てる。", "自分の物語は全体としてどのような構成になっているか？"], ["113", "起承転結の4つの部分を何構成というか？", "四部構成。", "物語を起・承・転・結の4つに分けて考える方法。", "自分のプロットを4つの部分に分類できるか？"], ["113", "起承転結の「起」の役割は？", "人物や舞台を提示し、事件の発端を描くこと。", "読者がこれから始まる物語を理解するための土台を作る。", "主人公と舞台、事件の発端が伝わっているか？"], ["113", "起承転結の「承」の役割は？", "事件を対立や葛藤によって発展させること。", "起で始まった事件をさらに動かしていく部分。", "起で始まった出来事が発展しているか？"], ["113", "起承転結の「転」の役割は？", "事件を最高潮に達させること。", "物語がクライマックスを迎える部分。", "物語の中で最も盛り上がる場面はどこか？"], ["113", "起承転結の「結」の役割は？", "事件を収拾し、物語を終えること。", "クライマックスの後に物語を締めくくる。", "事件の決着が読者に伝わっているか？"], ["113", "物語は必ず起承転結でなければならないか？", "必ずしもそうではない。", "著者は能の序破急を三部構成の例として紹介している。", "自分の作品に適した構成を選んでいるか？"], ["114", "長編の構成が複雑になる理由は？", "メインストーリーにサイドストーリーが絡むため。", "主人公以外の人物の事件も本筋と関係してくる。", "副次的な物語が本筋とどう関係しているか？"], ["114", "短編漫画ではどのような構成を目指すべきか？", "無駄のない、純化された構成。", "短いページ数では余計な要素を取り除くことが重要になる。", "本筋に関係しない場面や人物が残っていないか？"], ["114", "箱書きはもともと何の分野の用語か？", "映画。", "長い物語の構成を段階的に整理するために用いられてきた。", "物語を最初から順番に書くだけになっていないか？"], ["114", "大箱とは何か？", "物語を大まかな構成単位に分けた箱。", "起承転結など、物語全体を大きなまとまりに分ける。", "物語全体を大きなまとまりに分けられるか？"], ["115", "中箱とは何か？", "大箱をさらに細分化した箱。", "主人公やサイドストーリーなどについて、より詳しく整理する。", "長編の各部分を具体的な展開に分けられるか？"], ["115", "小箱とは何か？", "さらに具体的な単位に細分化した箱。", "大箱・中箱から段階的に細かくして作る。", "個々の場面まで具体化できているか？"], ["115", "短編漫画では、どの箱から始めてもよいか？", "小箱。", "著者は短編では大箱・中箱を省略して小箱から作る方法を採っている。", "必要以上に複雑な構成表を作っていないか？"], ["115", "箱書きで最も重要な作業は何か？", "プロットを具体的な場面に変えること。", "抽象的な文章を、実際に絵として表現できる場面へ変換する。", "文章で説明した出来事を絵にできるか？"], ["116", "箱書きでは場面について何を書くか？", "場所と、そこでの人物の行動。", "どこで誰が何をするのかを具体的に考えていく。", "各場面の場所・登場人物・行動が明確か？"], ["116", "箱書きで設定や状況を具体化するとは？", "実際に描ける出来事として表現すること。", "抽象的な背景説明を、人物の行動や具体的な場面に置き換える。", "設定を説明するだけでなく、出来事によって示せないか？"], ["117", "箱書きの際、作者は頭の中で何をしているか？", "漫画を描くシミュレーション。", "どのような場面や人物の組み合わせなら絵になるかを考える。", "その場面を実際の漫画として頭に思い浮かべられるか？"], ["117", "場面が変わると箱書きはどうするか？", "新しい箱を作る。", "場面ごとに区切ることで物語の流れを把握しやすくする。", "場面転換が曖昧になっていないか？"], ["117", "箱の数から何を見積もることができるか？", "作品に必要なページ数。", "著者は実例から1箱平均2ページ程度を目安としている。ただし固定的な規則ではない。", "予定ページ数に対して場面を詰め込みすぎていないか？"], ["118", "箱の数が多すぎる場合はどうするか？", "構成を再検討する。", "不要な場面や長すぎる展開を整理する。", "削除・統合できる場面はないか？"], ["118", "箱の数が少なすぎる場合は何を疑うか？", "物語に必要な要素が抜けていないか。", "プロットの段階で必要な描写が欠けている可能性を検討する。", "人物の感情や事件の展開に飛躍がないか？"], ["119", "箱書きの段階ではプロットを変更してもよいか？", "より面白くなるなら変更してよい。", "箱書きによって無駄や新しいアイデアが発見されるため、当初のプロットに固執する必要はない。", "最初に考えた展開にこだわりすぎていないか？"], ["119", "長編映画の構成をそのまま短編漫画に使えるか？", "そのまま使うことは難しい。", "作品の長さによって必要な展開速度や構成が異なる。", "短い作品に壮大すぎる物語を詰め込んでいないか？"], ["119", "著者が示す漫画制作の主な工程は？", "発想→プロット→箱書き→ネーム→ネームの推敲。", "各工程で作品を具体化し、必要に応じて前の段階も見直す。", "プロットの問題を残したまま作画へ進んでいないか？"], ["121", "著者の考える「起」はどこまでか？", "主人公に事件が降りかかるところまで。", "単なる人物紹介ではなく、物語が動き始めるところまでを考える。", "冒頭で主人公の身に何が起こるのか？"], ["122", "主人公は必ず最初に登場しなければならないか？", "必ずしもそうではない。", "他の人物の視点から主人公を紹介する方法もある。", "最初に登場する人物には明確な理由があるか？"], ["122", "著者のいう「ベタなやり方」とは？", "工夫のない、ありきたりな表現方法。", "必要な情報を伝えていても、それだけでは面白い場面にならない。", "思いついた最初の表現をそのまま採用していないか？"], ["122", "ベタな場面を思いついた場合、どうするか？", "別の見せ方を考える。", "ありきたりな方法を基準として、より面白い表現を探す。", "同じ内容を別の行動や場面で表現できないか？"], ["123", "ファーストシーンで読者に起こさせたい最初の反応は？", "「おや？」という驚きや疑問。", "読者の注意を引き、自然に作品の世界へ導く。", "最初のページやコマに読者が気になる要素があるか？"], ["123", "最初の「おや？」が薄れてきたらどうするか？", "さらに強い驚きや疑問を与える。", "読者の関心を持続させるため、段階的に刺激を重ねる。", "最初の引きだけで終わらず、次の興味が生まれているか？"], ["123", "著者がいうエモーションとは、ここでは何を指すか？", "読者の心に起こる感情の動き。", "驚きや疑問などによって読者の気持ちを動かしていく。", "各場面で読者にどんな感情を抱かせたいか？"], ["123", "ファーストシーンで説明する基本的な要素は？", "主要人物・人物像・場所や状況や時代・事件の発端。", "読者が物語を理解するために必要な情報を早い段階で提示する。", "冒頭だけで物語の基本的な状況を理解できるか？"], ["125", "短編漫画の冒頭で事件の発生が遅いと何が問題か？", "読者を物語に引き込む力が弱くなる。", "著者は映画のように時間をかけて説明する方法を短編にそのまま使うことを批判している。", "人物紹介や背景説明にコマを使いすぎていないか？"], ["126", "映画と短編漫画で特に異なる点は？", "物語を動かすスピード。", "短編漫画は限られたページ数で人物や事件を効果的に提示する必要がある。", "短編に適したテンポになっているか？"], ["126", "箱書きでは場面の内容以外に何を考えるか？", "誰の視点で、どんな感情を描くか。", "同じ出来事でも、誰の側から描くかによって読者の受け取り方が変わる。", "この場面は誰の視点で描かれているか？"], ["126", "客観視点とは何か？", "特定の人物の主観に偏らない視点。", "作者が場面や状況を外側から提示するような描き方。", "客観的な説明と人物の主観を区別できているか？"], ["127", "客観視点の場面ばかりが続くと何が問題か？", "人物の感情や個性が伝わりにくくなる。", "状況説明ばかりでは、主人公を中心とした物語になりにくい。", "説明のためだけのコマが続いていないか？"], ["127", "短編漫画では読者の視点を早く誰に合わせるべきか？", "主人公。", "主人公の視点を読者と共有させることを著者は重視している。", "読者は誰を中心に物語を読めばよいか分かるか？"], ["128", "『Pの悲劇』の冒頭は何を最初に提示しているか？", "ペット飼育禁止という団地の規則。", "物語の舞台と、後の事件につながる基本的な条件を提示している。", "事件の意味を理解するための前提が示されているか？"], ["129", "『Pの悲劇』では客観視点からどのように視点を移しているか？", "主人公の生活や人間関係へ移している。", "団地全体の状況から主人公個人の状況へと焦点を絞っている。", "全体状況の説明から主人公の体験へ自然につながっているか？"], ["131", "短編のファーストシーンで説明と同時にすべきことは？", "スピーディーに主人公の身に事件を起こすこと。", "設定や人物を紹介するだけではなく、物語を動かすことが必要になる。", "説明をしながら物語も進んでいるか？"], ["131", "人物に対する読者の最初の印象を覆すと、どんな効果があるか？", "驚きや疑問が生まれる。", "『Pの悲劇』では犬を撫でる人物について、後から意外な情報を与えている。", "人物の第一印象を単調にせず、意外性を持たせられないか？"], ["132", "主人公の立場をひっくり返すとはどういうことか？", "それまでの立場や状況を事件によって変化させること。", "『Pの悲劇』ではペット問題の当事者ではなかった主人公が、ペンギンを預かる当事者になる。", "事件の前後で主人公の立場に変化があるか？"], ["132", "ファーストシーンでサスペンスの土台を作るには？", "後の危機を読者が予想できる情報を先に提示する。", "敵役の存在と主人公の秘密を関連づけ、今後の危機を読者に予感させる。", "読者がこの先どうなるのか気にする仕掛けがあるか？"]];const stars=new Set([1,3,9,15,18,21,23,26,30,33,36,39,42,44,45]);const $=id=>document.getElementById(id);let order=qs.map((_,i)=>i),pos=0,show=false,mode='all',known={};try{known=JSON.parse(localStorage.getItem('manga113-132-v1')||'{}')||{}}catch{};function save(){try{localStorage.setItem('manga113-132-v1',JSON.stringify(known))}catch{}}function active(){return order.filter(i=>mode==='all'||(mode==='star'?stars.has(i+1):known[i]==='miss'))}function render(){let a=active();pos=Math.max(0,Math.min(pos,a.length-1));let i=a[pos],q=qs[i];let ok=Object.values(known).filter(v=>v==='ok').length,m=Object.values(known).filter(v=>v==='miss').length;$('stats').textContent=`理解済み ${ok} ／ 要復習 ${m} ／ 未学習 ${45-ok-m}`;$('progress').value=ok+m;$('position').textContent=a.length?`${pos+1} / ${a.length} 問`: '0 問';$('page').textContent=q?`第${i+1}問 ・ p.${q[0]} ${stars.has(i+1)?'★重要':''}`:'';$('card').innerHTML=q?(show?`<div class="small">${q[1]}</div><h3>答え</h3><div class="answer">${q[2]}</div><h3>解説</h3><div>${q[3]}</div><h3>制作チェック</h3><div class="check">${q[4]}</div><div class="hint small">タップして問題に戻る</div>`:`<div class="small">問題</div><h2>${q[1]}</h2><div class="hint small">タップまたは Space で答えを表示</div>`):'<h2>要復習の問題はありません。</h2>';$('prev').disabled=pos===0;$('next').disabled=pos>=a.length-1;$('flip').disabled=!q;$('ok').disabled=$('miss').disabled=!q||!show;$('flip').textContent=show?'問題に戻る [Space]':'めくる [Space]'}function flip(){if(active().length){show=!show;render()}}function move(d){pos+=d;show=false;render()}function rate(v){let i=active()[pos];if(i===undefined||!show)return;known[i]=v;save();if(!(mode==='miss'&&v==='ok'))pos++;show=false;render()}function shuffle(){for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}pos=0;show=false;render()}$('card').onclick=$('flip').onclick=flip;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('ok').onclick=()=>rate('ok');$('miss').onclick=()=>rate('miss');$('shuffle').onclick=shuffle;$('ordered').onclick=()=>{order=qs.map((_,i)=>i);pos=0;show=false;render()};$('mode').onchange=e=>{mode=e.target.value;pos=0;show=false;render()};$('reset').onclick=()=>{if(confirm('学習記録をリセットしますか？')){known={};save();pos=0;show=false;render()}};document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName))return;const k=e.key.toLowerCase();const fn={' ':flip,'arrowleft':()=>move(-1),'arrowright':()=>move(1),'1':()=>rate('ok'),'2':()=>rate('miss'),'s':shuffle}[k];if(fn){e.preventDefault();if(!e.repeat)fn()}else if(k==='enter'&&e.target===$('card')){e.preventDefault();flip()}});render();</script></html>
